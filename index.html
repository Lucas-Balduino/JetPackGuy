<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>JetPack Joyride</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles/tokens.css" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="src/styles/components.css" />
</head>
<body>
<div class="game-container">
  
    <div id="visor">0000 m</div>
        <button id="pauseBtn" class="btn-pixel" type="button" title="Pausar" aria-label="Pausar jogo">
      <img id="pauseBtnIcon" src="Images/PauseButton.png" alt="" width="86" height="100" />
    </button>
    <img id="MolduraPixelArt" src="Images/MolduraPixelArt.jpg" alt="" aria-hidden="true">
    <div class="game-frame">
        <canvas id="canvas" width="540" height="540"></canvas>
        <div id="loadingOverlay">Carregando...</div>
    </div>

    <div class="instructions">
        <b>Espaço</b> ou <b>Clique</b> para voar &nbsp;|&nbsp; <b>P</b> para pausar
    </div>
</div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
